name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Optional: a stable signing key so new builds install over old ones.
      # Without the secret, each build is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.jks
            echo "Using the stable signing key"
          else
            echo "No KEYSTORE_B64 secret: debug-signed build"
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      # Internet is allowed only for OpenStreetMap tiles. Fail if any other
      # network-related permission appears through a dependency.
      - name: Check permissions
        run: |
          set -e
          files=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml)
          [ -n "$files" ] || { echo "merged manifest not found"; exit 1; }
          grep -ho 'android.permission.[A-Z_]*' $files | sort -u
          if grep -lE 'READ_CONTACTS|READ_SMS|RECORD_AUDIO|CAMERA|ACCESS_BACKGROUND_LOCATION' $files; then
            echo "Unexpected permission in the merged manifest"; exit 1
          fi

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "BikeCompanion-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk BikeCompanion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BikeCompanion-apk
          path: BikeCompanion-*.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      # Release page: notes from CHANGELOG.md plus install steps, the APK under
      # a fixed name (for the "latest" download link) and a versioned name,
      # and SHA-256 checksums. GitHub adds the source zip and tar.gz itself.
      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          cp BikeCompanion.apk "BikeCompanion-v${V}.apk"
          sha256sum BikeCompanion.apk "BikeCompanion-v${V}.apk" > SHA256SUMS.txt
          awk -v v="$V" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          {
            echo "## What's new"
            echo
            if [ -s notes.md ]; then cat notes.md; else echo "See CHANGELOG.md."; fi
            echo
            cat .github/release-footer.md
          } > release.md
          cat release.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bike Companion ${{ github.ref_name }}
          body_path: release.md
          files: |
            BikeCompanion.apk
            BikeCompanion-v*.apk
            SHA256SUMS.txt
