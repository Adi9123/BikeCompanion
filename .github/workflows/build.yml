name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Optional: a stable signing key so new builds install over old ones.
      # Without the secret, each build is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.jks
            echo "Using the stable signing key"
          else
            echo "No KEYSTORE_B64 secret: debug-signed build"
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Assert no INTERNET permission
        run: |
          set -e
          files=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml)
          [ -n "$files" ] || { echo "merged manifest not found"; exit 1; }
          if grep -l 'android.permission.INTERNET' $files; then
            echo "INTERNET permission found in the merged manifest"; exit 1
          fi
          echo "OK: no INTERNET permission"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "RTRCompanion-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk RTRCompanion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RTRCompanion-apk
          path: RTRCompanion-*.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RTRCompanion.apk
